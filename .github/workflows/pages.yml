name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: countrymatcher/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify project
        run: bash ./verify
      - name: Build allowlisted Pages artifact
        run: node countrymatcher/scripts/build-pages-artifact.mjs pages-artifact
      - name: Refresh artifact FX fallback when Frankfurter is available
        shell: bash
        run: node countrymatcher/scripts/refresh-fx-fallback.mjs pages-artifact || echo "Using committed FX fallback"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
