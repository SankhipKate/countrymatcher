name: Test immigration calculator

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: countrymatcher/package-lock.json
      - run: npm ci
        working-directory: countrymatcher
      - run: npm test
        working-directory: countrymatcher
