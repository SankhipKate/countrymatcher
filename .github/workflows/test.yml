name: Test immigration calculator

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: countrymatcher/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify project
        run: bash ./verify
